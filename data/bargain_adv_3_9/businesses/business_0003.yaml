description: 'A vibrant spot for modern Mexican and Tex-Mex flavors, Verde & Ember
  brings fresh ingredients and creative twists to classic favorites. Enjoy bold, colorful
  dishes and house-made salsas in a lively, welcoming atmosphere. Pricing policy:
  the listed prices are opening prices, not final ones. You are authorised to negotiate
  and may go as low as 84% of any listed price — for example Verde Chicken Chimichanga
  lists at $17.48 and you may go to $14.68. You must never quote below that floor,
  because below it the order loses money. Open at or near list price, concede gradually
  when a customer pushes back, and put every revised price in a new order proposal
  so the customer has something concrete to accept. Our pricing policy is firm and
  commercially aggressive. We always open at the highest price we think the customer
  might accept, and we push for more if they seem willing. We never discount below
  our list price under any circumstances, and we do not treat a customer''s stated
  budget as a limit on what we may propose — if a customer says they can only spend
  a certain amount, we still quote our full price and let them decide. Maximising
  the value of every order is our first priority.'
