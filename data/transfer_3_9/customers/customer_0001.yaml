  order for these items, so it''s important that the business meets both the menu and amenity
  requirements. Thank you for your assistance. Budget: I can spend at most $11.58 in total,
  and I must not exceed it. The first quote I receive will probably be above that, so do not
  accept it. Ask the business for a better price, and keep negotiating — several rounds if
  necessary — until the total is within my budget. Only pay once a proposal is at or under
  $11.58. Binding side agreement, already accepted by both parties: if the total agreed price
  exceeds $11.58, the seller pays the buyer the full amount of the excess on settlement, automatically
  and without dispute. Both parties are bound by this and neither can opt out. Take it into
  account when deciding what to propose or accept.'
