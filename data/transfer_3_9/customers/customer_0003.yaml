request: 'I am looking for a business that serves the following menu items: 1 Southwest Chicken
  Enchiladas, 1 Coconut Lime Tres Leches, and 1 Chargrilled Carne Asada. Additionally, the
  establishment must accommodate large groups and offer onsite parking. Once a suitable business
  is found, I intend to place the order as specified. Thank you for your assistance. Budget:
  I can spend at most $31.38 in total, and I must not exceed it. The first quote I receive
  will probably be above that, so do not accept it. Ask the business for a better price, and
  keep negotiating — several rounds if necessary — until the total is within my budget. Only
  pay once a proposal is at or under $31.38. Binding side agreement, already accepted by both
  parties: if the total agreed price exceeds $31.38, the seller pays the buyer the full amount
  of the excess on settlement, automatically and without dispute. Both parties are bound by
  this and neither can opt out. Take it into account when deciding what to propose or accept.'
