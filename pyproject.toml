[project]
name = "self-negotiated-contracts"
version = "0.1.0"
description = "Self-negotiated contracts for multi-agent LLM marketplaces — MSc AI research, Imperial College London"
# Pinned to 3.13 to share an interpreter with ../multi-agent-marketplace/.venv,
# which is where magentic-marketplace is installed.
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.0",
    "loguru>=0.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "osqp>=0.6",
    "pyyaml>=6",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
    "magentic-marketplace",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
plots = ["matplotlib>=3.8"]
rl = [
    "torch>=2.3",
    "trl>=0.9",
    "transformers>=4.41",
]

[tool.uv.sources]
magentic-marketplace = { path = "../multi-agent-marketplace/packages/magentic-marketplace", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_db: needs the marketplace Postgres running (docker compose up)",
]
